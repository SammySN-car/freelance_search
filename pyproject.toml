[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-search"
version = "0.1.0"
description = "A local daily job/internship/freelance link list for Discord, scored against your own profile."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "freelance_search contributors" }]
dependencies = [
    "aiosqlite>=0.20,<1",
    "discord.py>=2.4,<3",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
freelance-search = "freelance_search.__main__:main"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: requires network access or a running local Ollama instance",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
